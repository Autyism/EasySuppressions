plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.terraformersmc.com/releases/" }
	// Polymer: lets players without the mod join and see stand-in blocks and items
	maven { url "https://maven.nucleoid.xyz/" }
	exclusiveContent {
		forRepository { maven { url "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"easysuppressions" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			if (System.getProperty("es.username") != null) {
				programArgs "--username", System.getProperty("es.username")
			}
			// Forward -Des.* system properties (e.g. -Des.selftest=true) to the game.
			System.properties.each { key, value ->
				if (key.toString().startsWith("es.")) {
					vmArg "-D${key}=${value}"
				}
			}
		}
		server {
			System.properties.each { key, value ->
				if (key.toString().startsWith("es.")) {
					vmArg "-D${key}=${value}"
				}
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Bundled: players without the mod see vanilla stand-ins; players with it keep the real blocks and items.
	modImplementation include("eu.pb4:polymer-core:${project.polymer_version}")
	include "eu.pb4:polymer-common:${project.polymer_version}"
	include "eu.pb4:polymer-networking:${project.polymer_version}"
	include "eu.pb4:polymer-reg-sync-manipulator:${project.polymer_version}"
	include "xyz.nucleoid:packet-tweaker:${project.packet_tweaker_version}"

	// Optional for players: a settings button in the mod list.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Compatibility testing in the dev client only (-Pwith_sodium=true); never a dependency.
	if (project.hasProperty("with_sodium")) {
		modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}
